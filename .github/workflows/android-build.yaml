name: Flutter Build Android

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: 'oracle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable

      - name: Validate keystore filename
        run: |
          if [ -z "${{ vars.KEYSTORE_FILE_NAME }}" ]; then
            echo "ERROR: KEYSTORE_FILE_NAME variable is not set"
            exit 1
          fi
          echo "Using keystore filename: ${{ vars.KEYSTORE_FILE_NAME }}"

      # - name: Create .env file
      #   env:
      #     ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
      #   run: |
      #     echo $ENV_FILE_BASE64 | base64 -d > .env

      - name: Create keystore file
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          # Ensure the directory exists
          mkdir -p android/app
          # Create the keystore file
          echo "$KEYSTORE_FILE" | base64 -d > "android/app/${{ vars.KEYSTORE_FILE_NAME }}"

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ vars.KEYSTORE_FILE_NAME }}" >> android/key.properties

      - name: Verify keystore and key.properties
        run: |
          echo "Keystore file:"
          ls -la "android/app/${{ vars.KEYSTORE_FILE_NAME }}" || echo "Keystore file not found"
          echo "key.properties file:"
          cat android/key.properties || echo "key.properties file not found"

      - name: Install dependencies
        run: flutter pub get --no-example --enforce-lockfile

      - name: Run genererators
        run: dart run build_runner build --delete-conflicting-outputs

      # - name: Run tests
      #   run: flutter test

      - name: Build APK
        run: flutter build apk --split-per-abi --release --split-debug-info --obfuscate

      - name: Build AAB
        run: flutter build appbundle --split-debug-info --obfuscate --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: build/app/outputs/bundle/release/*.aab
