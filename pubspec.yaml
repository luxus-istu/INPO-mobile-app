name: databank_mobile_app
description: A multi-feature Flutter app for smart piggy bank

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get_it: 8.2.0
  injectable: 2.5.2
  flutter_bloc: 9.1.1
  equatable: 2.0.7
  animated_splash_screen: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: 8.2.0
  injectable_generator: 2.9.0
  build_runner: 2.9.0
  bloc_lint: ^0.3.2

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/onder/Onder_Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600

  assets:
    - assets/images/
